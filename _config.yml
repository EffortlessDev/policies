# Custom properties
title: EA Security Policies
description: >-
  The following addresses core policies used by EA to maintain compliance and assure the proper protections of infrastructure used to store, process, and transmit ePHI for EA Customers.
keywords: Security, Compliance, Software, Infrastructure, Documentation
production_url: "https://effortlessdev.github.io/policies/"
git_url: "https://github.com/EffortlessDev/policies"

# Serving
baseurl: "/policies"
url: "https://effortlessdev.github.io"
redirects: yes
replacement_url: "https://trust.effortlessadmin.com"

# Conversion
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
  - jekyll-email-protect

kramdown:
  auto_ids: false

# SASS
sass:
  sass_dir: assets/_sass

# Collections
collections:
  chapters:
    output: true
    permalink: /chapters/:path/
defaults:
  -
    scope:
      path: ""
      type: "chapters"
    values:
      hidden: true
      layout: default

# Exclusions
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - SITECHANGELOG.md